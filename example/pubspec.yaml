publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  talkanote:
    path: ..

dev_dependencies:
